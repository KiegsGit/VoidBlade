org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric (versions taken from the official FabricMC/fabric-example-mod branch "26.3")
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
fabric_api_version=0.165.0+26.3

# Mod
# version = the update number (1 = v1). Bump it for every fix/update.
# Every push builds a release tagged v<version>; old releases are kept, never overwritten.
archives_base_name=voidblade
version=1
group=com.voidblade
