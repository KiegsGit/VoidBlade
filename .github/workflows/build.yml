name: Build Voidblade

# Runs on every push, and can be started manually from the "Actions" tab.
# RELEASES: every update gets its OWN release (tag v<version>, version from gradle.properties). Old releases are kept.
# To ship an update: bump `version` in gradle.properties and add .github/changes/<version>.md.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read mod version
        run: echo "VERSION=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Show output
        run: ls -la build/libs

      - name: Upload jar as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: voidblade-${{ env.VERSION }}
          path: build/libs/voidblade-${{ env.VERSION }}.jar

      - name: Publish a NEW GitHub Release for this version (direct .jar download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          CHANGES=".github/changes/$VERSION.md"
          if [ ! -f "$CHANGES" ]; then
            echo "::warning::Missing $CHANGES - add release notes for this version."
            echo "No change notes were written for this version." > "$CHANGES"
          fi
          sed -e "s|__REPO__|$REPO|g" \
              -e "s|__SHA__|$SHA|g" \
              -e "s|__SHORT__|${SHA:0:7}|g" \
              -e "s|__VERSION__|$VERSION|g" \
              -e "/__CHANGES__/{r $CHANGES" -e "d}" \
              .github/release-notes.md > release-notes.md
          # Only re-publish the SAME version's release (a re-run of this push). Other versions are never touched.
          gh release delete "v$VERSION" --yes --cleanup-tag || true
          gh release create "v$VERSION" build/libs/voidblade-$VERSION.jar \
            --title "Voidblade v$VERSION" \
            --notes-file release-notes.md \
            --target "$SHA" \
            --latest
